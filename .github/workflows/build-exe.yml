name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build the .exe files
        run: npm run dist:win

      - name: Upload the .exe files
        uses: actions/upload-artifact@v4
        with:
          name: your-little-music-library-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Attach the .exe files to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
